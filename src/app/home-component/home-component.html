<div class=" px-50 bg-[#FAFAFA] flex flex-col items-center justify-center bg-cover bg-center"
    style="background-image: url('images/home-bg.png')">
    <!-- Welcome Header -->
    <div class="text-center mt-25 mb-13">
        <h1 class="text-2xl font-semibold text-black"> Welcome, Mohamed <mat-icon
                svgIcon="esc-icons:waving-hand"></mat-icon> </h1>
    </div>
    <!-- Cards Grid -->
    <div class="flex flex-wrap flex-row items-center justify-center gap-10 sm:gap-16 md:gap-20 text-center px-6">
        <div *ngFor="let item of modules; let i = index" [routerLink]="item.route" class="flex flex-col items-center space-y-3 w-1/2 sm:w-1/3 md:w-1/5 lg:w-auto">
            <div
                class="bg-primary-50 hover:bg-primary-100 w-20 h-20 rounded-2xl flex items-center justify-center transition-all cursor-pointer">
                <mat-icon [svgIcon]="item.icon" class="!w-10 !h-10 text-primary-600"></mat-icon>
            </div>
            <p class="font-medium text-primary-800">
                {{ item.title }}
            </p>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-48 mb-5 text-sm text-primary-500"> Powered by <span class="text-primary-500 font-semibold">ESC</span> </div>
</div>
