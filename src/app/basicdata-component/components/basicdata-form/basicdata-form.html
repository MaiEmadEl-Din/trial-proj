<div class="max-w-6xl mx-auto my-10 rounded-2xl border border-primary-500">
    <!-- Header -->
    <div
        class="bg-gradient-to-r from-[#036EB4] to-[#103163] rounded-t-2xl px-6 py-3 text-white font-semibold flex items-center gap-2">
        <mat-icon svgIcon="esc-icons:plus" class="w-5 h-5"></mat-icon>
        <span>{{ isEditMode ? 'Edit Lookup' : 'Create New Lookup' }}</span>
    </div>

    <!-- Body -->
    <form [formGroup]="lookupForm" class="bg-white p-6 rounded-b-2xl space-y-8">
        <div [ngClass]="{ 'opacity-60 pointer-events-none': isEditMode && !isFormEditable }">
            <!-- Main Information -->
            <div>
                <h3 class="font-bold text-gray-800 mb-2">Main Information</h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Lookup Name (En) -->
                    <div>
                        <label class="block text-sm font-medium text-text-800 mb-1">Lookup name (En)</label>
                        <input type="text" formControlName="lookup_name_en" placeholder="Enter lookup name in English"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder:text-text-400 outline-none" />
                        <div *ngIf="
                lookupForm.get('lookup_name_en')?.touched &&
                lookupForm.get('lookup_name_en')?.invalid
              " class="text-xs text-red-500 mt-1">
                            Lookup name (En) is required
                        </div>
                    </div>

                    <!-- Lookup Name (Ar) -->
                    <div>
                        <label class="block text-sm font-medium text-text-800 mb-1">Lookup name (Ar)</label>
                        <input type="text" formControlName="lookup_name_ar" placeholder="Enter lookup name in Arabic"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder:text-text-400 outline-none" />
                        <div *ngIf="
                lookupForm.get('lookup_name_ar')?.touched &&
                lookupForm.get('lookup_name_ar')?.invalid
              " class="text-xs text-red-500 mt-1">
                            Lookup name (Ar) is required
                        </div>
                    </div>
                </div>

                <!-- Status -->
                <div class="mt-4 flex items-center justify-between border border-gray-200 rounded-md px-4 py-3">
                    <span class="text-sm font-medium text-text-800">Active / Inactive</span>
                    <label class="relative inline-flex items-center cursor-pointer select-none">
                        <input type="checkbox" formControlName="status" class="sr-only peer" />
                        <div
                            class="w-11 h-6 bg-gray-300 rounded-full peer-focus:outline-none peer-focus:ring-0
                      after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                      after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5
                      after:transition-all after:duration-300 peer-checked:bg-primary-500
                      peer-checked:after:translate-x-5 peer-checked:after:border-white transition-colors duration-300 ease-in-out">
                        </div>
                    </label>
                </div>
            </div>

            <!-- Lookup Fields -->
            <div>
                <h3 class="font-bold text-gray-800 mb-2">
                    Lookup Fields <span class="text-sm text-gray-500">2 of 2</span>
                </h3>

                <div formArrayName="fields" class="space-y-4">
                    <div *ngFor="let field of fields.controls; let i = index" [formGroupName]="i"
                        class="bg-primary-50 p-3 rounded-lg grid grid-cols-1 md:grid-cols-8 items-center gap-4">
                        <!-- Field Label (En) -->
                        <div class="col-span-3">
                            <label class="block text-sm font-medium text-text-800 mb-1">Field Label (En)</label>
                            <input type="text" formControlName="field_name_en" placeholder="Enter Field Label"
                                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder:text-text-400 outline-none" />
                            <div *ngIf="
                  fields.at(i)?.get('field_name_en')?.touched &&
                  fields.at(i)?.get('field_name_en')?.invalid
                " class="text-xs text-red-500 mt-1">
                                Field Label (En) is required
                            </div>
                        </div>

                        <!-- Field Label (Ar) -->
                        <div class="col-span-3">
                            <label class="block text-sm font-medium text-text-800 mb-1">Field Label (Ar)</label>
                            <input type="text" formControlName="field_name_ar" placeholder="Enter Field Label"
                                class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm placeholder:text-text-400 outline-none" />
                            <div *ngIf="
                  fields.at(i)?.get('field_name_ar')?.touched &&
                  fields.at(i)?.get('field_name_ar')?.invalid
                " class="text-xs text-red-500 mt-1">
                                Field Label (Ar) is required
                            </div>
                        </div>

                        <!-- Is Required -->
                        <div class="flex items-center gap-2 col-span-1">
                            <span class="text-sm font-medium text-text-800">Is Required</span>
                            <label class="relative inline-flex items-center cursor-pointer select-none">
                                <input type="checkbox" formControlName="required" class="sr-only peer" />
                                <div
                                    class="w-11 h-6 bg-gray-300 rounded-full peer-focus:outline-none peer-focus:ring-0
                      after:content-[''] after:absolute after:top-[2px] after:left-[2px]
                      after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5
                      after:transition-all after:duration-300 peer-checked:bg-primary-500
                      peer-checked:after:translate-x-5 peer-checked:after:border-white transition-colors duration-300 ease-in-out">
                                </div>
                            </label>
                        </div>

                        <!-- Delete -->
                        <button type="button" (click)="removeField(i)">
                            <mat-icon svgIcon="esc-icons:trash" class="cursor-pointer"></mat-icon>
                        </button>
                    </div>
                </div>

                <!-- Add Field -->
                <div class="flex justify-center mt-4">
                    <button type="button" (click)="addField()" class="text-primary-500 hover:text-primary-700">
                        <mat-icon svgIcon="mat_outline:add_circle_outline" class="cursor-pointer"></mat-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="flex justify-start gap-3 mt-6">
            <button *ngIf="!isEditMode || isFormEditable" (click)="save()" type="submit" [disabled]="isEqual()"
                class="bg-primary-500 text-white text-sm font-medium px-5 py-2 rounded-md cursor-pointer disabled:opacity-50">
                Save
            </button>

            <button *ngIf="isEditMode && !isFormEditable" (click)="toggleEdit()" type="button"
                class="bg-primary-500 text-white text-sm font-medium px-5 py-2 rounded-md cursor-pointer transition duration-150">
                Edit
            </button>

            <button type="button" (click)="back()"
                class="bg-primary-100 text-primary-600 text-sm font-medium px-5 py-2 rounded-md cursor-pointer transition duration-150">
                Back
            </button>
        </div>
    </form>
</div>
