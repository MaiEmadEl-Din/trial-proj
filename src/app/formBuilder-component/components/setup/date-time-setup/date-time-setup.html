<form [formGroup]="form" class="space-y-4 text-sm text-slate-700">
    <!-- Field Name -->
    <div>
        <label class="block mb-1 font-medium text-text-800">Field Name (Label)</label>
        <input formControlName="fieldName" type="text" class="w-full p-2 border border-gray-300 rounded-md bg-white" />
    </div>

    <!-- Type -->
    <div>
        <label class="block mb-1 font-medium text-text-800">Type</label>
        <div class="flex gap-2">
            <button type="button"
                [ngClass]="form.value.dateType === 'datetime' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2" (click)="form.patchValue({ dateType: 'datetime' })">Date &
                time</button>
            <button type="button"
                [ngClass]="form.value.dateType === 'date' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2" (click)="form.patchValue({ dateType: 'date' })">Date</button>
            <button type="button"
                [ngClass]="form.value.dateType === 'time' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2" (click)="form.patchValue({ dateType: 'time' })">Time</button>
        </div>
    </div>

    <!-- Selection Type -->
    <div *ngIf="form.value.dateType === 'datetime' || form.value.dateType === 'time'">
        <label class="block mb-1 font-medium text-text-800">Time selection</label>
        <div class="flex gap-2">
            <button type="button"
                [ngClass]="form.value.timeSelection === 'specific' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2"
                (click)="form.patchValue({ timeSelection: 'specific' })">Specific</button>
            <button type="button"
                [ngClass]="form.value.timeSelection === 'range' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2"
                (click)="form.patchValue({ timeSelection: 'range' })">Range</button>
        </div>
    </div>

    <div *ngIf="form.value.dateType === 'datetime' || form.value.dateType === 'date'">
        <label class="block mb-1 font-medium text-text-800">Date selection</label>
        <div class="flex gap-2">
            <button type="button"
                [ngClass]="form.value.dateSelection === 'specific' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2"
                (click)="form.patchValue({ dateSelection: 'specific' })">Specific</button>
            <button type="button"
                [ngClass]="form.value.dateSelection === 'range' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2"
                (click)="form.patchValue({ dateSelection: 'range' })">Range</button>
        </div>
    </div>

    <!-- Format options -->
    <div>
        <label class="block mb-1 font-medium text-text-800">Time zone</label>
        <select formControlName="timeZone" class="w-full p-2 border border-gray-300 rounded-md bg-white">
            <option value="local">Local-time</option>
            <option value="utc">UTC</option>
        </select>
    </div>

    <div>
        <label class="block mb-1 font-medium text-text-800">Time formats</label>
        <div class="flex gap-2">
            <button type="button"
                [ngClass]="form.value.timeFormat === '24h' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2" (click)="form.patchValue({ timeFormat: '24h' })">24 hours</button>
            <button type="button"
                [ngClass]="form.value.timeFormat === '12h' ? 'border-primary-500 text-primary-600' : 'border-gray-300 text-gray-600'"
                class="flex-1 border rounded-md p-2" (click)="form.patchValue({ timeFormat: '12h' })">12 Hours</button>
        </div>
    </div>

    <div>
        <label class="block mb-1 font-medium text-text-800">Date format</label>
        <select formControlName="dateFormat" class="w-full p-2 border border-gray-300 rounded-md bg-white">
            <option value="MM-DD-YYYY">MM-DD-YYYY</option>
            <option value="DD-MM-YYYY">DD-MM-YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
        </select>
    </div>

    <!-- Required Toggle -->
    <div class="flex items-center justify-between border border-gray-300 p-3 rounded-md">
        <span class="font-medium text-text-800">Required Field</span>
        <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" formControlName="required" class="sr-only peer" />
            <div class="w-10 h-5 bg-gray-200 rounded-full peer-checked:bg-primary-500 transition"></div>
            <div class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full peer-checked:translate-x-5 transition">
            </div>
        </label>
    </div>

    <!-- Optional Buttons -->
    <div class="flex items-center justify-between border border-gray-300 p-3 rounded-md">
        <span class="font-medium text-text-800">Time frame</span>
        <button type="button" class="text-primary-500 font-semibold text-sm">Set</button>
    </div>

    <div class="flex items-center justify-between border border-gray-300 p-3 rounded-md">
        <span class="font-medium text-text-800">Date frame</span>
        <button type="button" class="text-primary-500 font-semibold text-sm">Set</button>
    </div>

    <div class="flex items-center justify-between border border-gray-300 p-3 rounded-md">
        <span class="font-medium text-text-800">API Validation</span>
        <button type="button" class="text-primary-500 font-semibold text-sm">Set</button>
    </div>
</form>
