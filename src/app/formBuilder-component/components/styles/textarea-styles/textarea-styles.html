<div class="flex flex-col gap-6 text-sm text-gray-800 w-[240px]">
    <!-- Tabs -->
    <div class="flex w-full justify-center items-center">
        <button class="px-3 pb-2 text-sm font-medium border-b-2 w-full"
            [ngClass]="activeTab === 'default' ? 'border-sky-500 text-black' : 'border-transparent text-gray-400'"
            (click)="activeTab = 'default'">
            Default
        </button>
        <button class="px-3 pb-2 text-sm font-medium border-b-2 w-full"
            [ngClass]="activeTab === 'hover' ? 'border-sky-500 text-black' : 'border-transparent text-gray-400'"
            (click)="activeTab = 'hover'">
            Hover
        </button>
    </div>

    <div [ngSwitch]="activeTab">
        <!-- BASIC STYLES -->
        <div class="space-y-3">
            <div class="!text-sm !text-neutral-600 !font-semibold">Basic styles</div>

            <!-- Background Color -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-gray-600 text-sm">Background Color</label>
                    <div class="flex items-center gap-2 rounded border border-text-200 px-4 py-1">
                        <input type="color" class="w-5 h-6 cursor-pointer rounded"
                            [value]="item.styles?.backgroundColor || '#FFFFFF'"
                            (input)="updateStyle('backgroundColor', $event)" />
                        <div>{{ item.styles?.backgroundColor || '#FFFFFF' }}</div>
                    </div>
                </div>
            </div>

            <div *ngSwitchCase="'hover'" class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-gray-600 text-sm">Background Color</label>
                    <div class="flex items-center gap-2 rounded border border-text-200 px-4 py-1">
                        <input type="color" class="w-5 h-6 cursor-pointer rounded"
                            [value]="item.styles?.hover?.backgroundColor || '#FFFFFF'"
                            (input)="updateStyle('backgroundColor', $event)" />
                        <div>{{ item.styles?.hover?.backgroundColor || '#FFFFFF' }}</div>
                    </div>
                </div>
            </div>

            <!-- Enabled -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div class="flex items-center justify-between border border-text-200 rounded p-3">
                    <label class="text-gray-600 text-sm">Enabled</label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer" [checked]="item.styles?.enabled === true"
                            (change)="updateStyle('enabled', $event)" />
                        <div
                            class="w-10 h-5 bg-gray-200 rounded-full peer-checked:bg-sky-500 relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:h-4 after:w-4 after:rounded-full after:transition-all peer-checked:after:translate-x-5">
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- TEXT SECTION -->
        <div class="pt-2 space-y-3">
            <div class="!text-sm !text-neutral-600 !font-semibold">Text</div>

            <!-- Font -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Font</label>
                    <select class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="item.styles?.fontFamily || 'cairo'" (change)="updateStyle('fontFamily', $event)">
                        <option>sans-serif</option>
                        <option>serif</option>
                        <option>Inter</option>
                        <option>cairo</option>
                        <option>cursive</option>
                        <option>fantasy</option>
                    </select>
                </div>
            </div>

            <div *ngSwitchCase="'hover'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Font</label>
                    <select class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="item.styles?.hover?.fontFamily || 'cairo'"
                        (change)="updateStyle('fontFamily', $event)">
                        <option>sans-serif</option>
                        <option>serif</option>
                        <option>Inter</option>
                        <option>cairo</option>
                        <option>cursive</option>
                        <option>fantasy</option>
                    </select>
                </div>
            </div>

            <!-- Font Size -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Font size</label>
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="parseNumber(item.styles?.fontSize, 16)" (input)="updateStyle('fontSize', $event)" />
                </div>
            </div>

            <!-- Text Color -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-gray-600 text-sm">Text color</label>
                    <div class="flex items-center gap-2 rounded border border-text-200 px-4 py-1">
                        <input type="color" class="w-5 h-6 cursor-pointer rounded"
                            [value]="item.styles?.color || '#000000'" (input)="updateStyle('color', $event)" />
                        <div>{{ item.styles?.color || '#000000' }}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TEXT AREA SETTINGS -->
        <div class="pt-2 space-y-3">
            <div class="!text-sm !text-neutral-600 !font-semibold">Textarea Settings</div>

            <div *ngSwitchCase="'default'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Rows</label>
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="item.styles?.rows || 3" (input)="updateStyle('rows', $event)" />
                </div>
            </div>
        </div>

        <!-- BORDER SECTION -->
        <div class="pt-2 space-y-3">
            <div class="!text-sm !text-neutral-600 !font-semibold">Border</div>

            <!-- Border Width -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Border width</label>
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="parseNumber(item.styles?.borderWidth, 1)"
                        (input)="updateStyle('borderWidth', $event)" />
                </div>
            </div>

            <!-- Border Radius -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div>
                    <label class="block text-gray-600 mb-1">Border radius</label>
                    <input type="number" class="w-full border border-gray-300 rounded px-2 py-1"
                        [value]="parseNumber(item.styles?.borderRadius, 5)"
                        (input)="updateStyle('borderRadius', $event)" />
                </div>
            </div>

            <!-- Border Color -->
            <div *ngSwitchCase="'default'" class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-gray-600 text-sm">Border color</label>
                    <div class="flex items-center gap-2 rounded border border-text-200 px-4 py-1">
                        <input type="color" class="w-5 h-6 cursor-pointer rounded"
                            [value]="item.styles?.borderColor || '#CCCCCC'"
                            (input)="updateStyle('borderColor', $event)" />
                        <div>{{ item.styles?.borderColor || '#CCCCCC' }}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
