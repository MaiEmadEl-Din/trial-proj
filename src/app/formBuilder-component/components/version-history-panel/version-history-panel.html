<aside class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl transition-transform duration-300 z-50 font-[cairo]"
    [class.translate-x-full]="!versionHistory.isVersionHistoryOpen()">

    <div class="p-4 border-b border-gray-300 flex justify-between items-center">
        <h2 class="text-lg font-semibold">Version History</h2>
        <mat-icon svgIcon="mat_outline:close" class="cursor-pointer" (click)="versionHistory.closeVersionHistory()"></mat-icon>
    </div>

    <!-- Aside content -->
    <div class="p-4">
        @for (item of versionHistory.versionHistory(); track $index) {
        <div class="flex justify-between items-center py-5 px-2 hover:bg-primary-50 hover:rounded">
            <div class="flex items-center gap-2">
                <!-- Icons -->
                <div class="flex flex-col items-center text-gray-600">
                    <mat-icon svgIcon="esc-icons:shapes" class="text-xl"></mat-icon>
                </div>

                <!-- Text -->
                <div class="flex flex-col leading-7">
                    <div class="font-medium text-gray-900">{{item.version}}</div>
                    <div class="text-gray-400 text-sm">{{item.date}}</div>
                </div>
            </div>
            
            <button (click)="versionHistory.restoreVersion($index, canvasService)" class="border border-primary-600 px-2 py-1.5 flex items-center justify-center gap-2 rounded !text-primary-600 cursor-pointer">
                <mat-icon svgIcon="esc-icons:undo" class="!w-4 !h-4 !text-primary-600"></mat-icon>
                Restore</button>
        </div>
        }

        <div class="text-center text-text-400 mt-10">
            <p>Click "Restore" to revert your project to that point in time</p>
        </div>
    </div>

</aside>
