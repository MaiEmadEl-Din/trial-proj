<div class="text-center p-4">

  <div class="flex items-center justify-center mb-4">
    <div class="py-1 px-2  rounded-xl bg-white custom-shadow">
      <mat-icon svgIcon="esc-icons:delete" class="!w-10 !h-10"></mat-icon>
    </div>
  </div>

  <h2 class="text-xl font-semibold mb-2">Are you sure?</h2>
  <p class="text-neutral-500 mb-6">{{ data.message }}</p>

  <div class="flex justify-center gap-2">
    <button mat-button (click)="close()" class="px-2 py-2 bg-primary-100 !text-primary-500 rounded-md cursor-pointer">Cancel</button>
    <button mat-button color="warn" (click)="confirm()" class="px-10 py-2 bg-third-500 !text-white rounded-md cursor-pointer">
      Yes
    </button>
  </div>
</div>
